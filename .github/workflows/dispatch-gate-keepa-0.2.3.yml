name: Dispatch Gate Keepa 0.2.3 signed build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-gate-keepa-0.2.3.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gate-keepa-build.yml --repo "$GITHUB_REPOSITORY" --ref main
