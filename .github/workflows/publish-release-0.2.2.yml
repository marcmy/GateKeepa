name: Publish Gate Keepa 0.2.2 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-release-0.2.2.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed end-user artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh run download 32075567424 --repo "$GITHUB_REPOSITORY" --name GateKeepa-Windows-0.2.2 --dir release
          cd release
          sha256sum -c SHA256.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create gate-keepa-v0.2.2 release/GateKeepa-Setup-0.2.2.exe release/SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 80cbee0fbb6bf9ee55ac14c0bfe8096ce84657c2 \
            --title "Gate Keepa 0.2.2" \
            --notes $'Standalone Gate Keepa release.\n\n- Seller-specific Amazon Listings Restrictions / gating checks via SP-API\n- Requires the Product Listing role only; Pricing/Product Fees are deliberately out of scope\n- Mozilla-signed Firefox extension bundled in the Windows installer\n- One-time localhost browser pairing, with Firefox preferred explicitly\n- Windows helper stores Amazon secrets and the bridge token in Windows Credential Manager\n\nThe Windows executable is not Authenticode-signed, so SmartScreen may show an unknown-publisher warning.'
