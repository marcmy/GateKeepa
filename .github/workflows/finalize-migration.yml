name: Finalize Gate Keepa migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-migration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: migration/gate-keepa
          fetch-depth: 0

      - name: Finish restriction-only cleanup and Firefox handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove every remaining Product Fees / Pricing code path from the bridge.
          path = Path("bridge/server.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import math\n", "")
          text = text.replace(
              "        # Amazon's documented defaults are 5 rps for Listings Restrictions and\n"
              "        # 1 rps for getMyFeesEstimateForASIN. Stay slightly below each limit.\n"
              "        self._restrictions_gate = RateGate(0.21)\n"
              "        self._fees_gate = RateGate(1.02)\n",
              "        # Stay slightly below Amazon's documented default rate for Listings Restrictions.\n"
              "        self._restrictions_gate = RateGate(0.21)\n",
          )
          text = re.sub(
              r"\n    def fee_estimate\([\s\S]*?\n\ndef _amazon_error_message",
              "\n\ndef _amazon_error_message",
              text,
              count=1,
          )
          text = text.replace(
              '            if parsed.path == "/eligibility":\n'
              '                self._eligibility(body)\n'
              '            elif parsed.path == "/fees":\n'
              '                self._fees(body)\n'
              '            else:\n',
              '            if parsed.path == "/eligibility":\n'
              '                self._eligibility(body)\n'
              '            else:\n',
          )
          text = re.sub(
              r"\n    def _fees\([\s\S]*?\n\ndef main\(\)",
              "\n\ndef main()",
              text,
              count=1,
          )
          path.write_text(text, encoding="utf-8")

          forbidden = ["fee_estimate", "PriceToEstimateFees", 'parsed.path == "/fees"', "_fees_gate", "getMyFeesEstimateForASIN"]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f"Product Fees cleanup failed; {needle!r} remains in bridge/server.py")

          # Prefer Firefox explicitly for pairing and XPI installation. Falling back to the
          # Windows default handler remains useful on unusual/custom Firefox installations.
          path = Path("helper.py")
          text = path.read_text(encoding="utf-8")
          if "import subprocess\n" not in text:
              text = text.replace("import secrets\n", "import secrets\nimport subprocess\n")

          helper_functions = r'''
def find_firefox_executable() -> Path | None:
    if os.name != "nt":
        return None

    try:
        import winreg

        key_path = r"SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\firefox.exe"
        access_modes = [winreg.KEY_READ]
        for flag_name in ("KEY_WOW64_64KEY", "KEY_WOW64_32KEY"):
            flag = getattr(winreg, flag_name, 0)
            if flag:
                access_modes.append(winreg.KEY_READ | flag)
        for root in (winreg.HKEY_CURRENT_USER, winreg.HKEY_LOCAL_MACHINE):
            for access in access_modes:
                try:
                    with winreg.OpenKey(root, key_path, 0, access) as key:
                        value, _ = winreg.QueryValueEx(key, None)
                    candidate = Path(str(value).strip().strip('"'))
                    if candidate.is_file():
                        return candidate
                except OSError:
                    pass
    except (ImportError, AttributeError):
        pass

    candidates: list[Path] = []
    for env_name in ("ProgramFiles", "ProgramFiles(x86)"):
        root = os.environ.get(env_name)
        if root:
            candidates.append(Path(root) / "Mozilla Firefox" / "firefox.exe")
    local = os.environ.get("LOCALAPPDATA")
    if local:
        candidates.extend([
            Path(local) / "Mozilla Firefox" / "firefox.exe",
            Path(local) / "Programs" / "Mozilla Firefox" / "firefox.exe",
        ])
    return next((candidate for candidate in candidates if candidate.is_file()), None)


def open_firefox_target(target: str) -> bool:
    firefox = find_firefox_executable()
    if firefox is None:
        return False
    try:
        subprocess.Popen([str(firefox), target], close_fds=True)
        return True
    except OSError:
        logging.exception("Could not launch Firefox")
        return False

'''
          if "def find_firefox_executable()" not in text:
              text = text.replace("\ndef make_tray_image() -> Image.Image:\n", helper_functions + "\ndef make_tray_image() -> Image.Image:\n")

          text = text.replace(
              '        logging.info("Browser pairing window opened for 120 seconds")\n'
              '        webbrowser.open(url)\n'
              '        self.notify("Browser pairing opened. Complete it within two minutes.")\n',
              '        logging.info("Browser pairing window opened for 120 seconds")\n'
              '        if not open_firefox_target(url):\n'
              '            logging.warning("Firefox executable not found; opening pairing URL with the default browser")\n'
              '            webbrowser.open(url)\n'
              '        self.notify("Browser pairing opened. Complete it within two minutes.")\n',
          )
          text = text.replace(
              '        try:\n'
              '            os.startfile(xpi)  # type: ignore[attr-defined]\n'
              '        except Exception:\n'
              '            logging.exception("Could not open Firefox extension package")\n',
              '        try:\n'
              '            if not open_firefox_target(xpi.resolve().as_uri()):\n'
              '                os.startfile(xpi)  # type: ignore[attr-defined]\n'
              '        except Exception:\n'
              '            logging.exception("Could not open Firefox extension package")\n',
          )
          path.write_text(text, encoding="utf-8")

          # Fix the standalone developer command left over from the old nested layout.
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              r"py -3.12 .\bridge\server.py --config .\sourcing_cockpit\bridge\config.json",
              r"py -3.12 .\bridge\server.py --config .\bridge\config.json",
          )
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile helper.py bridge/server.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/server.py helper.py README.md
          if git diff --cached --quiet; then
            echo "No finalization changes needed."
            exit 0
          fi
          git commit -m "Finalize Gate Keepa restriction-only migration"
          git push origin HEAD:migration/gate-keepa
