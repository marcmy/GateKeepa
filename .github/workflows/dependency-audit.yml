name: Dependency Audit

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-helper.txt

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit helper dependencies
        run: python -m pip_audit --strict --requirement requirements-helper.txt
