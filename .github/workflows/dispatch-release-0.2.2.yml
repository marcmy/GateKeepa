name: Dispatch Gate Keepa 0.2.2 release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed Gate Keepa build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gate-keepa-build.yml --repo "$GITHUB_REPOSITORY" --ref main
