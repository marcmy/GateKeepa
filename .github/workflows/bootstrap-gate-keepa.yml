name: Bootstrap Gate Keepa

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-gate-keepa.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Gate Keepa
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Migrate project from book-resale-finder
        shell: bash
        run: |
          set -euo pipefail

          git switch -C migration/gate-keepa

          SOURCE="$RUNNER_TEMP/book-resale-finder"
          git clone --depth 1 --branch feature/sourcing-cockpit-extension \
            https://github.com/marcmy/book-resale-finder.git "$SOURCE"
          SOURCE_SHA="$(git -C "$SOURCE" rev-parse HEAD)"
          echo "Migrating Sourcing Cockpit source at $SOURCE_SHA"

          # Replace the placeholder repository contents with the standalone project.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SOURCE/sourcing_cockpit/." .
          mkdir -p .github/workflows
          cp "$SOURCE/.github/workflows/sourcing-cockpit-build.yml" .github/workflows/gate-keepa-build.yml

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          VERSION = "0.2.2"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # User-facing helper rebrand. Keep the no-space SourcingCockpit storage,
          # Credential Manager, mutex, and protocol identifiers for upgrade compatibility.
          helper = read("helper.py")
          helper = helper.replace('APP_NAME = "Sourcing Cockpit"', 'APP_NAME = "Gate Keepa"')
          helper = helper.replace('APP_VERSION = "0.2.1"', f'APP_VERSION = "{VERSION}"')
          helper = helper.replace(
              'UPDATE_API = "https://api.github.com/repos/marcmy/book-resale-finder/releases?per_page=50"',
              'UPDATE_API = "https://api.github.com/repos/marcmy/GateKeepa/releases?per_page=50"'
          )
          helper = helper.replace('UPDATE_TAG_PREFIX = "sourcing-cockpit-v"', 'UPDATE_TAG_PREFIX = "gate-keepa-v"')
          helper = helper.replace("Sourcing Cockpit", "Gate Keepa")
          helper = helper.replace("SourcingCockpit/", "GateKeepa/")
          helper = helper.replace("SourcingCockpit.xpi", "GateKeepa.xpi")
          helper = helper.replace("SourcingCockpit-Diagnostics", "GateKeepa-Diagnostics")
          helper = helper.replace('            "SourcingCockpit",\n            make_tray_image(),', '            "GateKeepa",\n            make_tray_image(),')
          helper = helper.replace('draw.text((17, 20), "SC"', 'draw.text((15, 20), "GK"')
          write("helper.py", helper)

          server = read("bridge/server.py")
          server = server.replace("Sourcing Cockpit", "Gate Keepa")
          server = server.replace("SourcingCockpit/0.2.1", f"GateKeepa/{VERSION}")
          server = server.replace("SourcingCockpitBridge/0.2.1", f"GateKeepaBridge/{VERSION}")
          server = server.replace('"service": "SourcingCockpitBridge"', '"service": "GateKeepaBridge"')
          server = server.replace('"version": "0.2.1"', f'"version": "{VERSION}"')
          server = server.replace("sourcing-cockpit-", "gate-keepa-")
          write("bridge/server.py", server)

          init = read("bridge/__init__.py").replace("Sourcing Cockpit", "Gate Keepa")
          write("bridge/__init__.py", init)

          config = json.loads(read("bridge/config.example.json"))
          config["user_agent"] = f"GateKeepa/{VERSION} (Language=Python/3.12; Platform=Windows)"
          write("bridge/config.example.json", json.dumps(config, indent=2) + "\n")

          manifest_path = Path("extension/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["name"] = "Gate Keepa"
          manifest["version"] = VERSION
          manifest["action"]["default_title"] = "Gate Keepa"
          # Preserve gecko.id so Mozilla treats Gate Keepa as an update to the signed add-on.
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          for path in [
              "extension/background.js",
              "extension/content/amazon.js",
              "extension/content/keepa.js",
              "extension/content/pair.js",
              "extension/popup/popup.html",
              "extension/options/options.html",
          ]:
              write(path, read(path).replace("Sourcing Cockpit", "Gate Keepa"))

          matrix = read("FEATURE_MATRIX.md").replace("Sourcing Cockpit status", "Gate Keepa status")
          write("FEATURE_MATRIX.md", matrix)

          readme = read("README.md")
          readme = readme.replace("Sourcing Cockpit", "Gate Keepa")
          readme = readme.replace("SourcingCockpit-Setup-0.2.1.exe", f"GateKeepa-Setup-{VERSION}.exe")
          readme = readme.replace("SourcingCockpit-Setup-X.Y.Z.exe", "GateKeepa-Setup-X.Y.Z.exe")
          readme = readme.replace("SourcingCockpitHelper.exe", "GateKeepa.exe")
          readme = readme.replace("SourcingCockpitHelper.spec", "GateKeepa.spec")
          readme = readme.replace(".github/workflows/sourcing-cockpit-build.yml", ".github/workflows/gate-keepa-build.yml")
          readme = readme.replace("sourcing_cockpit\\bridge\\server.py", "bridge\\server.py")
          readme = readme.replace("sourcing_cockpit/bridge/server.py", "bridge/server.py")
          readme = readme.replace("sourcing-cockpit-vX.Y.Z", "gate-keepa-vX.Y.Z")
          readme = readme.replace("SourcingCockpit.xpi", "GateKeepa.xpi")
          readme += (
              "\n## Rename compatibility\n\n"
              "Gate Keepa intentionally preserves the original Firefox add-on ID, Windows installer AppId, "
              "Credential Manager service name, localhost authentication header, and `%LOCALAPPDATA%\\SourcingCockpit` "
              "data directory. Those internal identifiers are retained so existing Sourcing Cockpit installations, "
              "credentials, pairing data, and Mozilla signing identity can upgrade in place.\n"
          )
          write("README.md", readme)

          # Rename/build the PyInstaller target.
          spec = read("SourcingCockpitHelper.spec").replace('name="SourcingCockpitHelper"', 'name="GateKeepa"')
          write("GateKeepa.spec", spec)
          Path("SourcingCockpitHelper.spec").unlink()

          # Keep the original AppId so 0.2.x installs upgrade in place; use new visible/output names.
          installer = read("installer/SourcingCockpit.iss")
          installer = installer.replace('#define MyAppVersion "0.2.1"', f'#define MyAppVersion "{VERSION}"')
          installer = installer.replace('#define RepoRoot "..\\\\.."', '#define RepoRoot ".."')
          installer = installer.replace("AppName=Sourcing Cockpit", "AppName=Gate Keepa")
          installer = installer.replace("DefaultDirName={localappdata}\\Programs\\SourcingCockpit", "DefaultDirName={localappdata}\\Programs\\GateKeepa")
          installer = installer.replace("DefaultGroupName=Sourcing Cockpit", "DefaultGroupName=Gate Keepa")
          installer = installer.replace("{#RepoRoot}\\sourcing_cockpit\\", "{#RepoRoot}\\")
          installer = installer.replace("SourcingCockpit-Setup-", "GateKeepa-Setup-")
          installer = installer.replace("SourcingCockpitHelper.exe", "GateKeepa.exe")
          installer = installer.replace("SourcingCockpit.xpi", "GateKeepa.xpi")
          installer = installer.replace("Sourcing Cockpit", "Gate Keepa")
          installer += (
              "\n[InstallDelete]\n"
              "Type: files; Name: \"{app}\\SourcingCockpitHelper.exe\"\n"
              "Type: files; Name: \"{app}\\SourcingCockpit.xpi\"\n"
              "Type: files; Name: \"{userstartup}\\Sourcing Cockpit.lnk\"\n"
          )
          write("installer/GateKeepa.iss", installer)
          Path("installer/SourcingCockpit.iss").unlink()

          # Standalone-repo workflow paths and names.
          wf_path = Path(".github/workflows/gate-keepa-build.yml")
          wf = wf_path.read_text(encoding="utf-8")
          permissions_at = wf.index("permissions:")
          wf = "name: Gate Keepa Build\n\non:\n  pull_request:\n  workflow_dispatch:\n\n" + wf[permissions_at:]
          wf = wf.replace("group: sourcing-cockpit-", "group: gate-keepa-")
          wf = wf.replace("sourcing_cockpit/", "")
          wf = wf.replace("Push-Location sourcing_cockpit", "Push-Location .")
          wf = wf.replace("SourcingCockpitHelper.spec", "GateKeepa.spec")
          wf = wf.replace("SourcingCockpitHelper.exe", "GateKeepa.exe")
          wf = wf.replace("SourcingCockpit.xpi", "GateKeepa.xpi")
          wf = wf.replace("SourcingCockpit-Setup-", "GateKeepa-Setup-")
          wf = wf.replace("installer/SourcingCockpit.iss", "installer/GateKeepa.iss")
          wf = wf.replace("SourcingCockpit-Windows-", "GateKeepa-Windows-")
          wf = wf.replace("SourcingCockpit-Developer-", "GateKeepa-Developer-")
          wf = wf.replace("Sourcing Cockpit", "Gate Keepa")

          # Do not submit the same extension version to AMO on every PR push.
          # PRs lint/package/test; a manual workflow_dispatch performs Mozilla signing.
          expr = "$" + "{{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}"
          needle = "      AMO_JWT_SECRET: $" + "{{ secrets.AMO_JWT_SECRET }}\n"
          wf = wf.replace(needle, needle + f"      SHOULD_SIGN: {expr}\n")
          wf = wf.replace(
              "if ($env:AMO_JWT_ISSUER -and $env:AMO_JWT_SECRET) {",
              "if ($env:SHOULD_SIGN -eq 'true' -and $env:AMO_JWT_ISSUER -and $env:AMO_JWT_SECRET) {"
          )
          wf = wf.replace(
              "AMO signing secrets are not configured; producing developer artifacts only.",
              "Mozilla signing skipped for this run; producing developer artifacts only."
          )
          wf_path.write_text(wf, encoding="utf-8")

          # The bootstrap workflow exists only on main to perform this one migration.
          Path(".github/workflows/bootstrap-gate-keepa.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Gate Keepa as standalone project"
          git push --force origin HEAD:migration/gate-keepa
